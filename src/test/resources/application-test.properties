spring.datasource.url=jdbc:h2:mem:eventtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.seed.enabled=false
app.upload.dir=target/test-uploads
# Schedulers effectively disabled during tests
app.scheduler.status-interval-ms=3600000
app.scheduler.reminder-interval-ms=3600000
