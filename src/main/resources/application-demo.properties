# ------------------------------------------------------------------
# "demo" profile: experimental database filled with a large dataset
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# (IntelliJ: Run configuration > Active profiles: demo)
#
# It uses its own database, "event_demo", so the main "event" database
# is never touched. Create it once with:  createdb -U postgres event_demo
# Reset it at any time with:              scripts/reset-demo-db.sh
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_demo}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
app.seed.enabled=true
app.seed.demo=true
app.upload.dir=${UPLOAD_DIR:uploads-demo}
