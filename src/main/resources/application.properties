spring.application.name=event

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# "update" keeps data between restarts; use "create-drop" to start from a clean schema each run
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Security ----------
# Must be at least 32 characters (256 bits) for HS256
jwt.secret=${JWT_SECRET:7c3d9a8e2b1f4567890abcdef12345678}
# 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ---------- Uploads ----------
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Demo data ----------
app.seed.enabled=${SEED_DATA:true}
# Large experimental dataset (activated by the "demo" profile, see application-demo.properties)
app.seed.demo=${SEED_DEMO:false}

# ---------- Scheduling ----------
# Event status transitions (PUBLISHED -> ONGOING -> COMPLETED) and reminders
app.scheduler.status-interval-ms=60000
app.scheduler.reminder-interval-ms=900000

server.port=${PORT:8080}
server.error.include-message=always
